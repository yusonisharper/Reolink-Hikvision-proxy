# reolink-hik-proxy example config
# Each camera entry is one virtual Reolink camera, backed by a Hikvision (hik:) or Dahua (dahua:) camera.
# The NVR connects to the listen address with the Reolink protocol (Baichuan, TCP 9000).

log_level: info          # debug shows how each Hikvision alert was mapped
trace: false             # true: print every decrypted Baichuan message (for debugging NVR compatibility)

# Optional: reply templates captured from a real camera (generated by tools/bc_dump.py --templates)
# Lookup order: templates_dir/<camera name>/<id>.xml > templates_dir/<id>.xml > built-in defaults
templates_dir: ./captured

# Settings written by the NVR or app (name, OSD, image settings etc.) are kept here across restarts.
# Layout: state/<camera name>/<message id>.xml, and name.txt holds the display name. Delete a file to restore its default.
state_dir: ./state

# How to answer a "read" request from the NVR that has no template: ok (200) or error (400)
unknown_reply: ok

# LAN search replies (the "search devices" of the NVR and Reolink Client): listens on UDP 2000, replies go to the peer's UDP 3000.
# On by default; false turns it off, or write 192.168.1.200:2000 to listen on one adapter only.
# discovery: true

# Optional (Linux, needs root): add each camera's listen IP to this interface, and keep it there while running.
# A Reolink NVR does not support different ports on one IP, so each virtual camera needs its own IP.
# alias_interface: eth0

# Optional: port that receives Hikvision "HTTP Listening / Alarm Server" pushes (used when a camera's hik.events is listen)
# hik_listen: 0.0.0.0:8088

cameras:
  - name: driveway
    # Give each virtual camera its own IP (macvlan / ip addr add) and keep the port at 9000.
    # When adding it manually on the NVR, enter this IP and choose the Reolink protocol.
    # 0.0.0.0:<port> needs no local IP: it listens on all adapters, keeps working on another computer, and the reported IP follows.
    # Don't use localhost: only this machine could connect.
    listen: 192.168.1.201:9000
    username: admin            # the username and password entered when adding the camera on the NVR
    password: "change-me"
    encryption: full_aes       # highest encryption accepted: none | bc | aes | full_aes (a Reolink NVR needs full_aes)
    # nego_class: 0x6614       # header class of the negotiation reply, for troubleshooting: 0x6614 (default, as in real camera samples) or 0x0000

    # Device identity (shown by the NVR; some features may depend on the model)
    model: RLC-811A
    # display_name: Driveway   # initial name shown in the NVR and app, default is name; after a rename there, state wins
    # uid: 95270000ABCDEFGH    # P2P UID. Unset (default) means IP connections only (an app or NVR using the UID goes through P2P and fails)
    # mac: EC:71:DB:12:34:56   # MAC in LAN search results; when unset it is derived from name and stays the same
    # serial: 00000000000000
    # firmware: v3.0.0.4308_2506201230

    hik:
      host: 192.168.1.64
      port: 80
      username: admin
      password: "hik-password"
      sync_name: true          # a rename in the NVR or app also renames the Hikvision channel (the name in the OSD)
      channel: 1               # channelID in alerts; on a Hikvision NVR, change it to the matching channel
      main_rtsp: rtsp://admin:hik-password@192.168.1.64:554/Streaming/Channels/101
      sub_rtsp:  rtsp://admin:hik-password@192.168.1.64:554/Streaming/Channels/102
      snapshot_path: /ISAPI/Streaming/channels/101/picture
      playback: true           # serve the Hikvision SD card recordings to the app and NVR (off automatically without storage)
      # playback_track: 101    # Hikvision recording track, 101 = main stream
      audio: true              # preview with sound (one more RTSP connection and an ffmpeg transcode, only while watching)
      # Motion boxes in live preview, from the camera's own target data (its WebSocket port 7681 must be on).
      # Nothing is computed on this device: a camera that sends no targets shows no boxes and no option.
      # motion_boxes: true
      light_seconds: 30        # how long after being switched on in the app the light goes back
      events: alertstream      # alertstream (pull) | listen (Hikvision pushes) | none
      # Skip the ffprobe detection (optional):
      # main_info: {codec: H265, width: 3840, height: 2160, fps: 20}
      # sub_info:  {codec: H264, width: 640, height: 360, fps: 15}

    events:
      # AI target types declared to the NVR: people | vehicle | dog_cat | face
      ai_types: [people, vehicle]

      # Smart detection zones. zone is the Reolink zone number (from 0), which is Hikvision's regionID - 1.
      # Only the types declared here are reported as smartAI; the rest are still reported as person/vehicle + motion.
      smart:
        crossline:             # Hikvision linedetection
          - {zone: 0, name: Gate, targets: [people, vehicle]}
          - {zone: 1, name: Road, targets: [vehicle]}
        intrusion:             # Hikvision fielddetection / regionEntrance
          - {zone: 0, name: Yard, targets: [people]}
        loitering: []          # Hikvision loitering

      # Hikvision's line crossing and intrusion are mostly single pulses: hold them for N seconds so the NVR can start recording
      hold: {motion: 3, ai: 5, smart: 5}
      ai_implies_motion: true          # with a person, vehicle or smart event, status also gets MD
      untargeted_smart_target: null    # for non-AcuSense models whose line crossing has no target type, can be set to people
      region_base: 1                   # Hikvision's regionID starts at 1

      # Override the default mappings (keys are not case sensitive)
      # event_map: {regionExiting: intrusion, PIR: motion}
      # Report scene change as Tamper Alert too; the app's switch then controls both Hikvision tamper and scene change detection:
      # event_map: {sceneChangeDetection: tamper}
      # Models without person/vehicle detection: ai_types: [], and targets: [] under smart
      # target_map: {nonMotorVehicle: people}

  # A Dahua camera: replace hik: with dahua:. Everything else (listen, events etc.) means the same.
  - name: front-door
    listen: 192.168.1.202:9000
    username: admin
    password: "change-me"
    model: RLC-811A            # for a PTZ camera, a model with PTZ is better, such as RLC-823A

    dahua:
      host: 192.168.1.108
      port: 80
      username: admin
      password: "dahua-password"
      sync_name: true          # a rename also changes the Dahua channel title (ChannelTitle)
      channel: 1               # from 1, the same as channel in RTSP; on a Dahua NVR, change it to the matching channel
      main_rtsp: rtsp://admin:dahua-password@192.168.1.108:554/cam/realmonitor?channel=1&subtype=0
      sub_rtsp:  rtsp://admin:dahua-password@192.168.1.108:554/cam/realmonitor?channel=1&subtype=1
      # snapshot_path: /cgi-bin/snapshot.cgi?channel=1   # default is built from channel
      playback: true           # serve the Dahua SD card recordings to the app and NVR (off automatically without storage)
      audio: true
      events: attach           # attach (eventManager event stream) | none; Dahua has no listen mode
      # ptz_max_seconds: 30    # PTZ ability is detected automatically; the longest a move runs without a stop

    events:
      ai_types: [people, vehicle]
      # zone is RuleId - region_base from the Dahua events. On first connecting a real camera, compare with RuleId in the -v log;
      # if it starts at 0, set region_base to 0.
      smart:
        crossline:             # Dahua CrossLineDetection (tripwire)
          - {zone: 0, name: Gate, targets: [people, vehicle]}
        intrusion:             # Dahua CrossRegionDetection (intrusion zone)
          - {zone: 0, name: Yard, targets: [people]}
        loitering: []          # Dahua WanderDetection
      hold: {motion: 3, ai: 5, smart: 5}
      region_base: 1
      # Other Dahua events can be added here (keys are not case sensitive), with targets from ObjectType in the event:
      # event_map: {FaceDetection: motion}
      # target_map: {Nonmotor: people}
